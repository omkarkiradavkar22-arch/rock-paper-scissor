<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>Rock Paper scissor Game</h1>
         <button class="theme">🌜</button>
    </nav>
    <div class="choice">
    <div  ><img id="rock" class="action" src="pic/IMG_20260606_230812.jpg"></div>
    <div><img id="paper" class="action" src="pic/IMG_20260606_230715.jpg"></div>
    <div ><img id="scissor" class="action" src="pic/IMG_20260606_230734.jpg"></div>
    </div>
    <div class="score-board">
        <div>
            <p class="user">0</p>
            <p>you</p>
        </div>
        <div>
            <p class="com">0</p>
            <p>comp</p>
        </div>
    </div>
    <div>
        <div class="msg-box">
            <div class="msg">play your move</div>
        </div>
        <button class="reset">reset game</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
